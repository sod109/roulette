name: Deploy Original Marble Roulette (No Ads, No Sound)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout original Marble Roulette
        uses: actions/checkout@v4
        with:
          repository: lazygyu/roulette
          ref: main
          path: upstream

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: upstream/yarn.lock

      - name: Remove ads and mute sound only
        run: node scripts/patch-original.mjs

      - name: Install dependencies
        working-directory: upstream
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Build original project
        working-directory: upstream
        run: yarn build

      - name: Keep original MIT license
        run: cp upstream/LICENSE upstream/dist/LICENSE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: upstream/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
